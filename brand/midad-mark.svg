<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 440" role="img" aria-label="منصة مداد للبناء">
  <title>منصة مداد للبناء</title>
  <!-- ===========================================================
       MIDAD — primary mark
       Five towers; the two central ones interlock into a letter M.
       Pure geometry, no text, no gradients: renders identically at
       16px in a browser tab and on a 3-metre banner.
       navy  #1D3E63    amber #E08A2E
       =========================================================== -->
  <g fill="none" fill-rule="evenodd">

    <!-- far-left tower (navy) -->
    <g fill="#1D3E63">
      <rect x="40" y="286" width="58" height="109" rx="3"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="53" y="302" width="12" height="12" rx="1.5"/>
      <rect x="73" y="302" width="12" height="12" rx="1.5"/>
      <rect x="53" y="326" width="12" height="12" rx="1.5"/>
      <rect x="73" y="326" width="12" height="12" rx="1.5"/>
      <rect x="53" y="350" width="12" height="12" rx="1.5"/>
      <rect x="73" y="350" width="12" height="12" rx="1.5"/>
    </g>

    <!-- left-mid tower (amber) -->
    <g fill="#E08A2E">
      <rect x="106" y="238" width="58" height="157" rx="3"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="119" y="254" width="12" height="12" rx="1.5"/>
      <rect x="139" y="254" width="12" height="12" rx="1.5"/>
      <rect x="119" y="278" width="12" height="12" rx="1.5"/>
      <rect x="139" y="278" width="12" height="12" rx="1.5"/>
      <rect x="119" y="302" width="12" height="12" rx="1.5"/>
      <rect x="139" y="302" width="12" height="12" rx="1.5"/>
      <rect x="119" y="326" width="12" height="12" rx="1.5"/>
      <rect x="139" y="326" width="12" height="12" rx="1.5"/>
      <rect x="119" y="350" width="12" height="12" rx="1.5"/>
      <rect x="139" y="350" width="12" height="12" rx="1.5"/>
    </g>

    <!-- ==== the M: two mirrored halves meeting at a shared peak ==== -->
    <!-- left half (navy) -->
    <path fill="#1D3E63"
          d="M172 395 L172 122 L256 206 L256 262 L212 218 L212 395 Z"/>
    <!-- right half (amber) -->
    <path fill="#E08A2E"
          d="M340 395 L340 122 L256 206 L256 262 L300 218 L300 395 Z"/>

    <!-- right-mid tower (amber) -->
    <g fill="#E08A2E">
      <rect x="348" y="238" width="58" height="157" rx="3"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="361" y="254" width="12" height="12" rx="1.5"/>
      <rect x="381" y="254" width="12" height="12" rx="1.5"/>
      <rect x="361" y="278" width="12" height="12" rx="1.5"/>
      <rect x="381" y="278" width="12" height="12" rx="1.5"/>
      <rect x="361" y="302" width="12" height="12" rx="1.5"/>
      <rect x="381" y="302" width="12" height="12" rx="1.5"/>
      <rect x="361" y="326" width="12" height="12" rx="1.5"/>
      <rect x="381" y="326" width="12" height="12" rx="1.5"/>
      <rect x="361" y="350" width="12" height="12" rx="1.5"/>
      <rect x="381" y="350" width="12" height="12" rx="1.5"/>
    </g>

    <!-- far-right tower (navy) -->
    <g fill="#1D3E63">
      <rect x="414" y="286" width="58" height="109" rx="3"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="427" y="302" width="12" height="12" rx="1.5"/>
      <rect x="447" y="302" width="12" height="12" rx="1.5"/>
      <rect x="427" y="326" width="12" height="12" rx="1.5"/>
      <rect x="447" y="326" width="12" height="12" rx="1.5"/>
      <rect x="427" y="350" width="12" height="12" rx="1.5"/>
      <rect x="447" y="350" width="12" height="12" rx="1.5"/>
    </g>

    <!-- ground arc -->
    <path d="M28 398 Q256 452 484 398"
          stroke="#1D3E63" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
